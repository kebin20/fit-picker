name: Check prototype
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:browser
        env:
          FIT_PICKER_REPORT_DIR: test-results/responsive-audit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-audit
          path: test-results/
